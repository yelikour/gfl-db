name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore images from gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1
          mkdir -p site/public
          git archive origin/gh-pages images | tar -x -C site/public
          echo "images: $(ls site/public/images | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
        working-directory: site

      - name: Deploy to gh-pages
        run: |
          cd site/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
